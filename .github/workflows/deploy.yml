name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch or PR; deploys to Pages never overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install gitleaks and exiftool
        run: |
          # Pinned by SHA-256 (from the release's checksums file), so a swapped download fails.
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          sudo tar xzf gitleaks.tgz -C /usr/local/bin gitleaks
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build:public
      # CI mode: the private name list does not exist on this machine by design, so this runs
      # the schema, pattern and gitleaks checks. The name check runs locally before commit.
      - run: npm run check-public
      # Deploys are off until the repo variable DEPLOY_PAGES is "true" (set when the repo goes
      # public and Pages is enabled). Until then every push is checked, tested and built only.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
        with:
          path: dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
